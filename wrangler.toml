name = "lokmanya"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve Astro's static assets. `.assetsignore` (in dist) keeps _worker.js private.
[assets]
binding = "ASSETS"
directory = "./dist"

# KV namespace that holds donations.xlsx, settings.json and the uploaded logo.
# Create it once:  npx wrangler kv namespace create DATA
# then paste the printed id below (replacing REPLACE_WITH_KV_ID).
[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_KV_ID"

# SESSION_SECRET is a secret — set it in the dashboard (Variables and Secrets)
# or with:  wrangler secret put SESSION_SECRET
