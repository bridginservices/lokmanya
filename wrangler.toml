name = "lokmanya"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve Astro's static assets. `.assetsignore` (in dist) keeps _worker.js private.
[assets]
binding = "ASSETS"
directory = "./dist"

# R2 bucket that holds donations.xlsx, settings.json and the uploaded logo.
# Create it once:  wrangler r2 bucket create lokmanya-data
[[r2_buckets]]
binding = "DATA"
bucket_name = "lokmanya-data"

# SESSION_SECRET is a secret — set it in the dashboard (Variables and Secrets)
# or with:  wrangler secret put SESSION_SECRET
